name: Nightly block E2E

# The Playwright block-tracking suite runs against a real wp-env storefront
# (block theme, real archive-product template, Cart and Mini Cart pages) and
# is too slow for the PR path. This schedule keeps it enforced anyway: a red
# run opens or updates a single `e2e-nightly` issue with the run link, and a
# green run closes it. Never a required check — it must not block merges.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    name: Playwright blocks suite (wp-env)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Regenerate the production autoload
        # The committed vendor/ carries only the autoloader files, and the
        # checked-in copies can be stale relative to the packages they
        # reference — stale enough to break both plugin activation and
        # composer's own plugin bootstrap. The plugin has no production
        # dependencies, so clearing vendor/ and running a bare no-dev
        # install writes a correct, self-contained autoloader.
        run: |
          rm -rf vendor
          composer install --no-dev --no-progress --no-interaction

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start wp-env and seed the block storefront
        run: npm run test:e2e:blocks:env:start

      - name: Run the block E2E suite
        id: e2e
        run: npm run test:e2e:blocks

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/blocks/playwright-report
            tests/e2e/blocks/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Open or update the failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'e2e-nightly';
            const title = 'Nightly block E2E is failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().slice(0, 10);
            const line = `Red on ${date}: [run ${context.runId}](${runUrl}). The Playwright report is attached to the run as the \`playwright-report\` artifact.`;

            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (e) {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'b60205', description: 'Nightly Playwright E2E failures' });
            }

            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: label });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open.data[0].number, body: line });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                labels: [label],
                body: `The scheduled block E2E run failed.\n\n${line}\n\nThis issue is updated by later red runs and closed automatically by the next green one.`,
              });
            }

      - name: Close the failure issue on green
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'e2e-nightly';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: label });
            for (const issue of open.data) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Green again: [run ${context.runId}](${runUrl}). Closing.` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
            }
